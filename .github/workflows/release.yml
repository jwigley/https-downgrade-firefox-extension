name: Sign and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update manifest
        run: |
          jq '.version = "${{ steps.version.outputs.VERSION }}" | .browser_specific_settings.gecko.id = "${{ secrets.EXTENSION_ID }}"' src/manifest.json > tmp.json
          mv tmp.json src/manifest.json

      - name: Sign extension
        run: |
          web-ext sign \
            --source-dir=src \
            --api-key=${{ secrets.AMO_API_KEY }} \
            --api-secret=${{ secrets.AMO_API_SECRET }} \
            --channel=unlisted

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/*.xpi

      - name: Get XPI download URL
        id: xpi
        run: |
          XPI_URL=$(echo '${{ steps.release.outputs.assets }}' | jq -r '.[0].browser_download_url')
          echo "URL=$XPI_URL" >> $GITHUB_OUTPUT

      - name: Generate update.json
        run: |
          mkdir -p docs
          cat > docs/update.json << EOF
          {
            "addons": {
              "${{ secrets.EXTENSION_ID }}": {
                "updates": [
                  {
                    "version": "${{ steps.version.outputs.VERSION }}",
                    "update_link": "${{ steps.xpi.outputs.URL }}"
                  }
                ]
              }
            }
          }
          EOF

      - name: Commit update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/update.json
          git commit -m "Update update.json for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main
